[workspace]
resolver = "2"
members = ["crates/core", "crates/ui", "crates/desktop"]
default-members = ["crates/desktop"]

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.97.1"
authors = ["Kibet arap Sum <kibetarapsum@gmail.com>"]
description = "A local-first desktop timetable for planning a day and understanding a week"
license = "MIT"
repository = "https://github.com/arapsum/cadence"
homepage = "https://github.com/arapsum/cadence"

[workspace.dependencies]
cadence-core = { path = "crates/core" }
cadence-ui = { path = "crates/ui" }
# Keep the source identity aligned with gpui-component's Zed dependency; the
# committed lockfile pins both packages to the exact GPUI revision.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
  "wayland",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "49229371e095bfd2ca77d336b5972b16956f0a87" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "49229371e095bfd2ca77d336b5972b16956f0a87" }
chrono = "0.4.45"
uuid = { version = "1.24.1", features = ["serde", "v7"] }
jiff = { version = "0.2.35", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
async-channel = "2.5.0"
ksni = { version = "0.3.6", default-features = false, features = ["async-io"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
